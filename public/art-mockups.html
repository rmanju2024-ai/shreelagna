<!doctype html>
<html lang="en">
  <head>

    <title>Ritual mockups · MarriageConnect</title>
    <style>
      body { margin: 0; font-family: Georgia, serif; background: #f6ead4; color: #3f0e0d; }

      h1 { font-size: 1.4rem; margin: 0 0 0.4rem; }
      p { margin: 0 0 1.2rem; color: #6a574c; }

  <body>
    <main>
      <h1>Wedding ritual mockups</h1>
      <p>Not on the live Home page. Pick A, B, C or D.</p>
      <figure>
        <img src="/art-mockups/r1-pheras.jpg" alt="Pheras around the sacred fire" />
        <figcaption>A — Pheras (birds circling the sacred fire)</figcaption>
      </figure>
      <figure>
        <img src="/art-mockups/r2-varmala.jpg" alt="Two wedding garlands" />
        <figcaption>B — Varmala (garlands meeting)</figcaption>
      </figure>
      <figure>
        <img src="/art-mockups/r3-saptapadi.jpg" alt="Seven diyas as seven steps" />
        <figcaption>C — Saptapadi (seven steps / seven diyas)</figcaption>
      </figure>
      <figure>
        <img src="/art-mockups/r4-thali.jpg" alt="Wedding ritual thali" />
        <figcaption>D — Shubh thali (haldi, rice, kumkum)</figcaption>
      </figure>
